url: https://rootcoder007.github.io/rmoriedata/
template:
  bootstrap: 5
  includes:
    in_header: |
      <meta name="google-site-verification" content="8ORzeHrfoPIOrujfV-km-kXCi9HD8dvL5GYH-GqwjYI">

home:
  links:
    - text: Install from r-universe
      href: https://rootcoder007.r-universe.dev/rmoriedata
    - text: Analysis package (rmorie)
      href: https://github.com/rootcoder007/rmorie
    - text: Source on GitHub
      href: https://github.com/rootcoder007/rmoriedata

navbar:
  structure:
    right: [search, universe, github]
  components:
    universe:
      icon: fa-box-open
      href: https://rootcoder007.r-universe.dev/rmoriedata
      aria-label: r-universe

reference:
  - title: Bundled datasets
    desc: >
      Discover, load, and inspect the packaged Canadian public-data tables
      (OTIS carceral data, CIHI health tables, Chicago crime) that the rmorie
      analysis functions consume.
    contents:
      - mdcat
      - mdload
      - hostcat
      - hostlogin
      - mdpath
      - mddict
      - mdsums
      - mdverify
      - chiload
      - chiclr
      - cihitbls
      - cihiget
      - siuload
  - title: Differential privacy
    desc: >
      Calibrated-noise mechanisms (Laplace, Gaussian) for releasing
      privacy-preserving counts, histograms, and means at a stated epsilon.
    contents:
      - dplapcnt
      - dplaphist
      - dpgmean
      - dpbudget
      - dpspent
  - title: Statistical disclosure control
    desc: >
      Re-identification safeguards for microdata releases: k-anonymity and
      l-diversity checks plus small-cell suppression.
    contents:
      - kanonvrf
      - ldivvrf
      - cellsupp
  - title: Core utilities
    desc: Shared primitives used across the package.
    contents:
      - mdmean
      - mdsha
      - mdask
      - mdllmconf
  - title: Sample data objects
    desc: >
      Small documented data frames bundled for examples and tests
      (lazy-loaded via data()).
    contents:
      - arrest_sample
      - complaint_sample
  - title: International datasets
    desc: >
      Non-Canadian tables in the bundled store, reached by slug through
      mdload().
    contents:
      - rmoriedata-victoria
