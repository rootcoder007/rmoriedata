url: https://rootcoder007.github.io/rmoriedata/
template:
  bootstrap: 5
  includes:
    in_header: |
      <meta name="google-site-verification" content="8ORzeHrfoPIOrujfV-km-kXCi9HD8dvL5GYH-GqwjYI">

home:
  links:
    - text: Install from r-universe
      href: https://rootcoder007.r-universe.dev/rmoriedata
    - text: Source on GitHub
      href: https://github.com/rootcoder007/rmoriedata

navbar:
  structure:
    right: [search, universe, github]
  components:
    universe:
      icon: fa-box-open
      href: https://rootcoder007.r-universe.dev/rmoriedata
      aria-label: r-universe

reference:
  - title: Differential privacy
    desc: >
      Exact discrete Laplace noise for counts and histograms, the analytic
      Gaussian mechanism for means, and a privacy budget the releases are
      charged against.
    contents:
      - dplapcnt
      - dplaphist
      - dpgmean
      - dpbudget
      - dpspent
  - title: k-anonymity and l-diversity
    desc: >
      Checks of a table's quasi-identifier classes before release.
    contents:
      - kanonvrf
      - ldivvrf
  - title: Cell suppression
    desc: >
      Primary and complementary suppression of small cells, audited for
      exact recovery from the margins.
    contents:
      - cellsupp
  - title: Bundled datasets and readers
    desc: >
      Discover, load, verify and inspect the bundled open-data tables
      (Ontario correctional and use-of-force releases, SIU director's
      reports, CIHI data tables, Chicago crime and others).
    contents:
      - mdcat
      - mdload
      - mdpath
      - mddict
      - mdsums
      - mdverify
      - chiload
      - chiclr
      - cihitbls
      - cihiget
      - siuload
  - title: Sample data objects
    desc: >
      Small documented data frames bundled for examples and tests
      (lazy-loaded via data()).
    contents:
      - arrest_sample
      - complaint_sample
  - title: International datasets
    desc: >
      Non-Canadian tables in the bundled store, reached by slug through
      mdload().
    contents:
      - rmoriedata-victoria
  - title: Hosted tables
    desc: >
      Curated tables served at data.rmorie.com, checked against the
      manifest's SHA-256.
    contents:
      - hostcat
  - title: Core utilities and language model
    desc: Shared compiled primitives, and questions about the catalogue.
    contents:
      - mdmean
      - mdsha
      - mdask
      - mdllmconf
