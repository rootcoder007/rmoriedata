# On-demand refresh of the SIU drid manifest, before a release.
#
# Crawls the SIU director's-reports indexes (en + fr) and appends any new reports to
# inst/extdata/siu_drid_manifest.csv.gz, at a polite 2-second rate. It does NOT commit:
# the manifest is covered by the XMSS-signed _checksums.csv, and that key is stateful
# (each signature spends a one-time index), so it never leaves the maintainer's machine.
# A refresh committed without re-signing would fail morie_data_verify() and
# test-data-integrity.R. Download the artifact, copy it into inst/extdata/, then run
# data-raw/sign_store.R locally and commit both together. No schedule: the package
# ships its data with a release, not weekly.
name: siu-manifest-refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - name: Install httr2
        run: Rscript -e 'install.packages("httr2")'
      - name: Refresh manifest
        run: Rscript data-raw/refresh_siu_manifest.R
      - name: Report
        run: |
          if git diff --quiet inst/extdata/siu_drid_manifest.csv.gz; then
            echo "Manifest unchanged."
          else
            rows=$(Rscript -e 'cat(nrow(read.csv(gzfile("inst/extdata/siu_drid_manifest.csv.gz"))))')
            echo "Manifest changed: ${rows} rows. Download the artifact, then re-sign locally with data-raw/sign_store.R."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siu-drid-manifest
          path: inst/extdata/siu_drid_manifest.csv.gz
