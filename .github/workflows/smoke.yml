# Clean-user smoke: install this commit on three OSes and run the exported entry points for real
# in an empty HOME (inst/smoke/smoke.R). The tag is only cut when this and `build` are green.
name: smoke
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    env:
      # remotes and pak read it for GitHub; without it remotes sends a stale built-in token (HTTP 401)
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev
      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload any::testthat any::withr any::httr2 any::jsonlite
      - name: install dependencies with base R (when pak cannot solve)
        if: steps.deps.outcome == 'failure'
        shell: Rscript {0}
        run: |
          repos <- c("https://rootcoder007.r-universe.dev", "https://stan-dev.r-universe.dev", "https://cloud.r-project.org")
          install.packages(c("remotes", "pkgload", "testthat", "withr", "httr2", "jsonlite"), repos = repos)
          # rmoriebricklayer first: install_deps cannot meet the >= 1.0.0 floor from r-universe alone
          remotes::install_github("rootcoder007/rmorie-bricklayer@v1.0.0", upgrade = "never")
          remotes::install_deps(".", dependencies = NA, repos = repos, upgrade = "never")
      - name: install
        shell: bash
        run: R CMD INSTALL .
      - name: smoke
        env:
          MORIE_SMOKE_KEY: ${{ secrets.MORIE_SMOKE_KEY }}
          MORIE_SMOKE_PKG: rmoriedata
        run: Rscript inst/smoke/smoke.R
