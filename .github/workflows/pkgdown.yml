name: pkgdown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # bricklayer comes from GitHub HEAD via DESCRIPTION `Remotes:`
          # (latest; new exports present immediately). r-universe is the
          # binary fallback for other deps.
          extra-packages: any::pkgdown, local::.
          extra-repositories: https://rootcoder007.r-universe.dev
          needs: website
          cache-version: 2
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
