name: pkgdown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install libcurl (bricklayer's C++ SystemRequirement)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install rmoriebricklayer (GitHub HEAD preferred; r-universe fallback)
        run: |
          install.packages("remotes", repos = "https://cloud.r-project.org")
          ok <- tryCatch({ remotes::install_github("rootcoder007/rmorie-bricklayer", upgrade = "never", force = TRUE); TRUE },
                         error = function(e) { message("github: ", conditionMessage(e)); FALSE })
          if (!ok || !requireNamespace("rmoriebricklayer", quietly = TRUE))
            install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
          if (!requireNamespace("rmoriebricklayer", quietly = TRUE)) stop("rmoriebricklayer unavailable")
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          cache-version: 2
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
