# Standard R CMD check across the CRAN-relevant platform/version matrix.
# SHA-pinned actions to match the rest of the morie family.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: R-CMD-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install libcurl (bricklayer's C++ SystemRequirement)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install rmoriebricklayer (GitHub HEAD preferred; r-universe fallback)
        # Not on CRAN. Prefer the GitHub HEAD (always the latest -- new exports
        # like bricklayer_fetch present immediately); fall back to the
        # r-universe binary if GitHub is unavailable. Runs before dependency
        # resolution so the hard Import is already satisfied.
        run: |
          install.packages("remotes", repos = "https://cloud.r-project.org")
          ok <- tryCatch({
            remotes::install_github("rootcoder007/rmorie-bricklayer",
                                    upgrade = "never", force = TRUE); TRUE
          }, error = function(e) { message("github: ", conditionMessage(e)); FALSE })
          if (!ok || !requireNamespace("rmoriebricklayer", quietly = TRUE)) {
            message("falling back to r-universe")
            install.packages("rmoriebricklayer",
                             repos = c("https://rootcoder007.r-universe.dev",
                                       "https://cloud.r-project.org"))
          }
          if (!requireNamespace("rmoriebricklayer", quietly = TRUE))
            stop("rmoriebricklayer unavailable from GitHub and r-universe")
          cat("rmoriebricklayer", as.character(packageVersion("rmoriebricklayer")), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          cache-version: 3
          needs: check
      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
